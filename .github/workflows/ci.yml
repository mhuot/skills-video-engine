name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
            arch: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - name: Run ShellCheck
        run: shellcheck scripts/*.sh
      - name: Validate Compose helper
        run: docker compose config --quiet
      - name: Test dependency manifest
        run: python -m unittest discover -s scripts -p "test_*.py"
      - name: Build image
        run: docker build --platform "${{ matrix.platform }}" -t "skills-video-engine:test-${{ matrix.arch }}" .
      - name: Run smoke test
        run: bash scripts/smoke_test.sh "skills-video-engine:test-${{ matrix.arch }}"
      - name: Run command through Compose helper
        env:
          SKILLS_VIDEO_ENGINE_IMAGE: skills-video-engine:test-${{ matrix.arch }}
          VIDEO_PROJECT_DIR: ${{ github.workspace }}/tests/fixtures/minimal-project
        run: bash scripts/engine.sh hyperframes --version
      - name: Run mounted-project end-to-end test
        run: bash scripts/e2e_test.sh "skills-video-engine:test-${{ matrix.arch }}"
